name: Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Run test suites
    runs-on: ubuntu-latest
    # A newer push to the same branch makes the in-flight run redundant.
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned rather than read from .nvmrc, which is still on 20.11.1.
          # Vitest 4 needs ^20.19 or >=22 -- on 20.11.1 it dies at startup with
          # ERR_REQUIRE_ESM loading std-env.
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.3

      # apps/cli runs its tests through `bun test`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Covers apps/web (node project), apps/mobile, apps/cli and
      # packages/db-operations. The web browser project and the Playwright e2e
      # suite are deliberately excluded -- both need a browser installed, so
      # they belong in a separate workflow rather than slowing this one down.
      - name: Run tests
        run: pnpm run test
