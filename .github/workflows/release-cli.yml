name: Release CLI
on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release URLs are configured
        env:
          BAHAR_WEB_URL: ${{ secrets.BAHAR_WEB_URL }}
          BAHAR_API_URL: ${{ secrets.BAHAR_API_URL }}
        run: |
          if [ -z "$BAHAR_WEB_URL" ] || [ -z "$BAHAR_API_URL" ]; then
            echo "::error::Set the BAHAR_WEB_URL and BAHAR_API_URL secrets (Settings > Secrets and variables > Actions > Secrets) before cutting a CLI release."
            exit 1
          fi

      - name: Build binaries
        working-directory: apps/cli
        env:
          BAHAR_WEB_URL: ${{ secrets.BAHAR_WEB_URL }}
          BAHAR_API_URL: ${{ secrets.BAHAR_API_URL }}
          BAHAR_CLI_VERSION: ${{ github.ref_name }}
        run: |
          declare -A targets=(
            [bun-linux-x64]=bahar-linux-x64
            [bun-darwin-x64]=bahar-darwin-x64
            [bun-darwin-arm64]=bahar-darwin-arm64
            [bun-windows-x64]=bahar-windows-x64.exe
          )

          for target in "${!targets[@]}"; do
            asset="${targets[$target]}"

            bun build --compile \
              --target="$target" \
              --minify-whitespace \
              --minify-syntax \
              --define "process.env.BAHAR_WEB_URL='$BAHAR_WEB_URL'" \
              --define "process.env.BAHAR_API_URL='$BAHAR_API_URL'" \
              --define "process.env.BAHAR_CLI_VERSION='${BAHAR_CLI_VERSION#cli-v}'" \
              --outfile "$asset" \
              src/index.ts
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            apps/cli/bahar-linux-x64
            apps/cli/bahar-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos-unsigned
          path: |
            apps/cli/bahar-darwin-x64
            apps/cli/bahar-darwin-arm64

  # Sign the macOS binaries with the Developer ID certificate and notarize them.
  # Besides Gatekeeper, a stable signature keeps macOS from re-asking for
  # keychain access (where the CLI stores its token) after every update.
  sign-macos:
    name: Sign and notarize macOS binaries
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/cli/entitlements.plist
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: binaries-macos-unsigned
          path: dist

      - name: Verify signing secrets are configured
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name secret before cutting a CLI release."
              exit 1
            fi
          done

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"

          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign binaries
        run: |
          for binary in dist/bahar-darwin-x64 dist/bahar-darwin-arm64; do
            chmod +x "$binary"
            # The identifier must stay the same across releases: macOS keys
            # keychain access to team ID + identifier.
            codesign --force --timestamp --options runtime \
              --entitlements apps/cli/entitlements.plist \
              --identifier app.bahar.cli \
              --keychain "$SIGNING_KEYCHAIN" \
              --sign "Developer ID Application" \
              "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done

          # The runner is Apple silicon; a crash here means missing entitlements.
          dist/bahar-darwin-arm64 version

      - name: Notarize binaries
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"

          # A bare binary can't have a notarization ticket stapled to it, so
          # Gatekeeper looks it up online on first run.
          for binary in dist/bahar-darwin-x64 dist/bahar-darwin-arm64; do
            ditto -c -k --keepParent "$binary" "$binary.zip"
            result="$(xcrun notarytool submit "$binary.zip" \
              --key "$key_path" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
              --wait --timeout 30m --output-format json)"
            echo "$result"

            status="$(echo "$result" | jq -r .status)"
            if [ "$status" != "Accepted" ]; then
              submission_id="$(echo "$result" | jq -r .id)"
              xcrun notarytool log "$submission_id" \
                --key "$key_path" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
              echo "::error::Notarization of $binary finished with status $status."
              exit 1
            fi
            rm "$binary.zip"
          done

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          if [ -n "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: |
            dist/bahar-darwin-x64
            dist/bahar-darwin-arm64

  release:
    name: Create GitHub release
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: binaries-macos
          path: dist

      - name: Create release and upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/bahar-linux-x64 \
            dist/bahar-darwin-x64 \
            dist/bahar-darwin-arm64 \
            dist/bahar-windows-x64.exe \
            --repo "${{ github.repository }}" \
            --title "Bahar CLI ${{ github.ref_name }}" \
            --generate-notes
