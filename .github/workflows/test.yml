name: Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Run test suites
    runs-on: ubuntu-latest
    # Nothing here writes to the repository, and the job runs code authored in
    # the pull request.
    permissions:
      contents: read
    # A newer push to the same branch makes the in-flight run redundant.
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Keeps the checkout token out of the workspace the test run can read.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.3

      # apps/cli runs its tests through `bun test`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Covers apps/web (node project), apps/mobile, apps/cli and
      # packages/db-operations. The web browser project and the Playwright e2e
      # suite are deliberately excluded -- both need a browser installed, so
      # they belong in a separate workflow rather than slowing this one down.
      - name: Run tests
        run: pnpm run test
